name: "ShellCheck"
on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Run ShellCheck
      run: find . -type f -name "*.sh" -exec shellcheck {} +